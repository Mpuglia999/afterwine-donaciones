<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Gracias! - Fundación Desfibrilar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #faf7f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border-radius: 20px; padding: 48px 40px; max-width: 480px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
  .icon { font-size: 56px; margin-bottom: 16px; }
  h1 { font-size: 28px; color: #141414; margin-bottom: 12px; }
  p { color: #666; font-size: 16px; line-height: 1.6; margin-bottom: 24px; }
  .btn { display: inline-block; padding: 14px 32px; background: #c41c24; color: #fff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 15px; }
  .btn:hover { opacity: .9; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">❤️</div>
  <h1>¡Gracias por tu donación!</h1>
  <p>Tu aporte hace posible que sigamos cardioprotegiendo espacios y salvando vidas en toda Argentina.</p>
  <p style="font-size:14px;color:#999;">Recibirás un comprobante en tu email registrado en Mercado Pago.</p>
  <a href="https://afterwine.desfibrilar.org.ar/" class="btn">Volver al After Wine</a>
</div>
</body>
</html>
